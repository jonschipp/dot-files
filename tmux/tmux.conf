unbind C-b
set -g prefix C-a
setw -g monitor-activity on
set -g visual-activity on
set -g mouse on

bind -n C-l select-pane -L
bind -n C-h select-pane -R
#bind -n C-j select-pane -U # Conflicts with my drop down terminal key
bind -n C-k select-pane -D

# Command-key bindings.
#
# macOS terminals never deliver Cmd to the tty, so tmux cannot bind it
# directly. Ghostty (ghostty/config in this repo) translates each Cmd chord
# into one of the private escape sequences below, which tmux picks up as a
# user-key. Keep the two files in sync: user-keys[N] here == keybind N there.
set -s user-keys[0]  "\033[3000~"   # Cmd-d
set -s user-keys[1]  "\033[3001~"   # Cmd-D
set -s user-keys[2]  "\033[3002~"   # Cmd-[
set -s user-keys[3]  "\033[3003~"   # Cmd-]
set -s user-keys[4]  "\033[3004~"   # Cmd-Shift-Enter
set -s user-keys[5]  "\033[3005~"   # Cmd-t
set -s user-keys[6]  "\033[3006~"   # Cmd-Left
set -s user-keys[7]  "\033[3007~"   # Cmd-Right
set -s user-keys[8]  "\033[3008~"   # Cmd-Up
set -s user-keys[9]  "\033[3009~"   # Cmd-Down

bind -n User0 split-window -h -c "#{pane_current_path}"   # side-by-side
bind -n User1 split-window -v -c "#{pane_current_path}"   # stacked
bind -n User2 previous-window
bind -n User3 next-window
bind -n User4 resize-pane -Z
bind -n User5 new-window -c "#{pane_current_path}"
bind -n User6 select-pane -L
bind -n User7 select-pane -R
bind -n User8 select-pane -U
bind -n User9 select-pane -D

# Same bindings under the prefix, for terminals that aren't Ghostty.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind Enter resize-pane -Z

# github.com/seebi/tmux-colors-solarized
source-file -q ~/.tmux/tmuxcolors-dark.conf

# GNU screen muscle memory. The prefix is already C-a; these add screen's
# window/region keys on top of the tmux defaults (which still work).
bind C-a last-window                    # screen: C-a C-a  (toggle last window)
bind a   send-prefix                    # screen: C-a a    (send a literal C-a)
bind C-c new-window -c "#{pane_current_path}"
bind Space next-window
bind A   command-prompt -I "#W" "rename-window '%%'"
bind '"' choose-window
bind "'" command-prompt -p index "select-window -t '%%'"
bind k   confirm-before -p "kill window #W? (y/n)" kill-window
bind Escape copy-mode
bind S   split-window -v -c "#{pane_current_path}"   # screen: split
bind Tab select-pane -t :.+                          # screen: focus
bind X   kill-pane                                   # screen: remove region
bind Q   kill-pane -a                                # screen: only
